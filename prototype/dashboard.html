<title>Price Tracker</title>
<style>
  :root {
    --paper: #F4F6F1;
    --surface: #FFFFFF;
    --surface-2: #EEF1EA;
    --ink: #1C231D;
    --ink-soft: #5B655C;
    --ink-faint: #8A927F;
    --line: #DBE1D6;
    --accent: #2F5D8A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4ECF4;
    --good: #2E7D5B;
    --good-soft: #E1F1E7;
    --warn: #B4791F;
    --warn-soft: #F6E9D4;
    --danger: #B23A34;
    --danger-soft: #F7DFDC;
    --shadow: 0 1px 2px rgba(28, 35, 29, 0.06), 0 1px 1px rgba(28, 35, 29, 0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14170F;
      --surface: #1B1F16;
      --surface-2: #20251A;
      --ink: #E7EAE1;
      --ink-soft: #9CA696;
      --ink-faint: #6D7666;
      --line: #2C3325;
      --accent: #7EA8D6;
      --accent-ink: #0F1610;
      --accent-soft: #223448;
      --good: #4FAE84;
      --good-soft: #16352A;
      --warn: #D89A4A;
      --warn-soft: #3A2A14;
      --danger: #E07872;
      --danger-soft: #3A1E1C;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 1px rgba(0, 0, 0, 0.25);
    }
  }

  :root[data-theme="dark"] {
    --paper: #14170F;
    --surface: #1B1F16;
    --surface-2: #20251A;
    --ink: #E7EAE1;
    --ink-soft: #9CA696;
    --ink-faint: #6D7666;
    --line: #2C3325;
    --accent: #7EA8D6;
    --accent-ink: #0F1610;
    --accent-soft: #223448;
    --good: #4FAE84;
    --good-soft: #16352A;
    --warn: #D89A4A;
    --warn-soft: #3A2A14;
    --danger: #E07872;
    --danger-soft: #3A1E1C;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 1px rgba(0, 0, 0, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Segoe UI Variable", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .num {
    font-family: "Cascadia Code", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  a { color: inherit; text-decoration: none; }

  [hidden] { display: none !important; }

  input[type="text"], input[type="password"], input[type="url"] {
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
    width: 100%;
  }

  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .form-error {
    color: var(--danger);
    font-size: 12px;
    margin: 0;
    min-height: 15px;
  }

  /* ---------- Login ---------- */
  .login-view {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
  }

  .login-card {
    width: 100%;
    max-width: 300px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .login-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
  }

  /* ---------- Shell ---------- */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 20px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
  }

  .brand .mark, .login-brand .mark {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    flex: none;
  }

  .brand .mark svg, .login-brand .mark svg { width: 13px; height: 13px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 7px;
    color: var(--ink-soft);
    font-weight: 500;
    cursor: default;
  }

  .nav-item svg {
    width: 16px;
    height: 16px;
    flex: none;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
  }

  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .nav-item:not(.active):hover { background: var(--surface); color: var(--ink); }

  .sidebar-footer {
    margin-top: auto;
    padding: 10px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  .logout-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

  .logout-btn:hover { color: var(--danger); }

  /* ---------- Main ---------- */
  .main { padding: 28px 32px 48px; max-width: 1280px; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
  }

  .topbar h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .topbar .sub { color: var(--ink-soft); font-size: 13px; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    padding: 9px 15px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }

  .btn-primary:disabled { opacity: 0.6; cursor: default; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 15px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-small { padding: 6px 12px; font-size: 12px; }

  .btn-primary svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-head h2 {
    font-size: 15px;
    margin: 0;
  }

  .section-head .count {
    color: var(--ink-faint);
    font-size: 12px;
  }

  .products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .empty {
    grid-column: 1 / -1;
    color: var(--ink-faint);
    font-size: 13px;
    padding: 10px 2px 22px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .thumb {
    height: 84px;
    border-radius: 8px;
    background: var(--surface-2);
    display: grid;
    place-items: center;
    color: var(--ink-faint);
  }

  .thumb svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.4; }

  .card .name {
    font-weight: 600;
    font-size: 13px;
    line-height: 1.35;
    min-height: 35px;
    text-wrap: balance;
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .store-chip {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
  }

  .stock-pill {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  .stock-pill.in { color: var(--good); background: var(--good-soft); }
  .stock-pill.low { color: var(--warn); background: var(--warn-soft); }
  .stock-pill.out { color: var(--danger); background: var(--danger-soft); }
  .stock-pill.unknown { color: var(--ink-soft); background: var(--surface-2); }

  .price-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .price {
    font-size: 19px;
    font-weight: 700;
  }

  .checked {
    color: var(--ink-faint);
    font-size: 11px;
  }

  .card.add {
    border-style: dashed;
    border-color: var(--ink-faint);
    background: transparent;
    box-shadow: none;
    color: var(--ink-soft);
    min-height: 100%;
  }

  .add-trigger {
    background: none;
    border: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 100%;
    height: 100%;
    padding: 20px 0;
  }

  .card.add .plus {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    margin-bottom: 2px;
  }

  .card.add .plus svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; }

  .card.add .label { font-weight: 600; font-size: 12.5px; }
  .card.add .hint { font-size: 11px; color: var(--ink-faint); }

  .add-form {
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .add-form-actions { display: flex; gap: 8px; }
  .add-form-actions .btn-primary, .add-form-actions .btn-secondary { flex: 1; }

  .card.add.editing .add-trigger { display: none; }
  .card.add.editing .add-form { display: flex; }

  @media (max-width: 980px) {
    .products { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<div class="login-view" id="login-view">
  <form class="login-card" id="login-form">
    <div class="login-brand">
      <span class="mark">
        <svg viewBox="0 0 24 24"><path d="M3 12 L12 3 L21 12 L21 21 L3 21 Z" /></svg>
      </span>
      Price Tracker
    </div>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="btn-primary" type="submit">Log in</button>
    <p class="form-error" id="login-error"></p>
  </form>
</div>

<div class="app" id="app-view" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24"><path d="M3 12 L12 3 L21 12 L21 21 L3 21 Z" /></svg>
      </span>
      Price Tracker
    </div>

    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      Dashboard
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24"><path d="M4 4 L12 4 L20 12 L12 20 L4 12 Z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg>
      Products
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24"><path d="M3 9 L4 4 L20 4 L21 9"/><path d="M4 9 L20 9 L20 20 L4 20 Z"/><path d="M9 20 L9 14 L15 14 L15 20"/></svg>
      Stores
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7 L12 12 L16 14.5"/></svg>
      Past Sales
    </a>

    <div class="sidebar-footer">
      <button type="button" class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <div class="sub" id="topbar-sub">Loading&hellip;</div>
      </div>
    </div>

    <section>
      <div class="section-head">
        <h2>Tracked products</h2>
        <span class="count" id="product-count"></span>
      </div>

      <div class="products">
        <div id="product-list" style="display:contents"></div>

        <article class="card add" id="add-card">
          <button type="button" class="add-trigger" id="add-toggle">
            <span class="plus">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </span>
            <span class="label">Add product</span>
            <span class="hint">Track a new URL</span>
          </button>

          <form class="add-form" id="add-form">
            <label for="product-url">Product URL</label>
            <input type="url" id="product-url" name="url" placeholder="https://&hellip;" required>
            <div class="add-form-actions">
              <button type="submit" class="btn-primary btn-small">Add</button>
              <button type="button" class="btn-secondary btn-small" id="add-cancel">Cancel</button>
            </div>
            <p class="form-error" id="add-error"></p>
          </form>
        </article>
      </div>
    </section>
  </main>
</div>

<script>
  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");
  const loginForm = document.getElementById("login-form");
  const loginError = document.getElementById("login-error");
  const logoutBtn = document.getElementById("logout-btn");

  const topbarSub = document.getElementById("topbar-sub");
  const productCount = document.getElementById("product-count");
  const productList = document.getElementById("product-list");

  const addCard = document.getElementById("add-card");
  const addToggle = document.getElementById("add-toggle");
  const addCancel = document.getElementById("add-cancel");
  const addForm = document.getElementById("add-form");
  const addError = document.getElementById("add-error");

  const STOCK_LABELS = {
    in_stock: { text: "In stock", cls: "in" },
    low_stock: { text: "Low stock", cls: "low" },
    out_of_stock: { text: "Out of stock", cls: "out" },
  };

  function stockInfo(status) {
    return STOCK_LABELS[status] || { text: "Unknown", cls: "unknown" };
  }

  function truncateWords(text, maxWords) {
    const words = text.trim().split(/\s+/);
    if (words.length <= maxWords) return text;
    return words.slice(0, maxWords).join(" ") + "…";
  }

  function showApp() {
    loginView.hidden = true;
    appView.hidden = false;
  }

  function showLogin() {
    appView.hidden = true;
    loginView.hidden = false;
  }

  function renderProducts(products) {
    const today = new Date().toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    const storeCount = new Set(products.map((p) => p.store)).size;
    productCount.textContent = `${products.length} item${products.length === 1 ? "" : "s"}`;
    topbarSub.textContent = `${today} · ${products.length} product${products.length === 1 ? "" : "s"} tracked across ${storeCount} store${storeCount === 1 ? "" : "s"}`;

    productList.innerHTML = "";

    if (products.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No products tracked yet — add one to get started.";
      productList.appendChild(empty);
      return;
    }

    for (const product of products) {
      const stock = stockInfo(product.stock_status);
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="thumb">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/></svg>
        </div>
        <div class="name"></div>
        <div class="meta-row">
          <span class="store-chip"></span>
          <span class="stock-pill ${stock.cls}">${stock.text}</span>
        </div>
        <div class="price-row">
          <span class="price num"></span>
          <span class="checked"></span>
        </div>
      `;
      const fullName = product.name || "Untitled product";
      const nameEl = card.querySelector(".name");
      nameEl.textContent = truncateWords(fullName, 6);
      nameEl.title = fullName;
      card.querySelector(".store-chip").textContent = product.store || "Unknown store";
      card.querySelector(".price").textContent =
        product.price != null ? `$${Number(product.price).toFixed(2)}` : "—";
      card.querySelector(".checked").textContent = product.checked_at
        ? `checked ${new Date(product.checked_at).toLocaleDateString()}`
        : "not yet checked";
      productList.appendChild(card);
    }
  }

  async function loadProducts() {
    const res = await fetch("/api/products");
    if (res.status === 401) {
      showLogin();
      return;
    }
    const products = await res.json();
    showApp();
    renderProducts(products);
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    loginError.textContent = "";
    const formData = new FormData(loginForm);
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: formData.get("username"),
        password: formData.get("password"),
      }),
    });
    if (res.ok) {
      loginForm.reset();
      loadProducts();
    } else {
      const data = await res.json().catch(() => ({}));
      loginError.textContent = data.error || "Login failed.";
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    showLogin();
  });

  addToggle.addEventListener("click", () => {
    addCard.classList.add("editing");
  });

  addCancel.addEventListener("click", () => {
    addForm.reset();
    addError.textContent = "";
    addCard.classList.remove("editing");
  });

  addForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    addError.textContent = "";
    const formData = new FormData(addForm);
    const submitBtn = addForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "Adding…";
    try {
      const res = await fetch("/api/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: formData.get("url") }),
      });
      const data = await res.json();
      if (!res.ok) {
        addError.textContent = data.error || "Could not add product.";
        return;
      }
      addForm.reset();
      addCard.classList.remove("editing");
      loadProducts();
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Add";
    }
  });

  loadProducts();
</script>
