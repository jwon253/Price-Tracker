<title>Price Tracker</title>
<style>
  :root {
    --paper: #F4F6F1;
    --surface: #FFFFFF;
    --surface-2: #EEF1EA;
    --ink: #1C231D;
    --ink-soft: #5B655C;
    --ink-faint: #8A927F;
    --line: #DBE1D6;
    --accent: #2F5D8A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4ECF4;
    --good: #2E7D5B;
    --good-soft: #E1F1E7;
    --warn: #B4791F;
    --warn-soft: #F6E9D4;
    --danger: #B23A34;
    --danger-soft: #F7DFDC;
    --shadow: 0 1px 2px rgba(28, 35, 29, 0.06), 0 1px 1px rgba(28, 35, 29, 0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14170F;
      --surface: #1B1F16;
      --surface-2: #20251A;
      --ink: #E7EAE1;
      --ink-soft: #9CA696;
      --ink-faint: #6D7666;
      --line: #2C3325;
      --accent: #7EA8D6;
      --accent-ink: #0F1610;
      --accent-soft: #223448;
      --good: #4FAE84;
      --good-soft: #16352A;
      --warn: #D89A4A;
      --warn-soft: #3A2A14;
      --danger: #E07872;
      --danger-soft: #3A1E1C;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 1px rgba(0, 0, 0, 0.25);
    }
  }

  :root[data-theme="dark"] {
    --paper: #14170F;
    --surface: #1B1F16;
    --surface-2: #20251A;
    --ink: #E7EAE1;
    --ink-soft: #9CA696;
    --ink-faint: #6D7666;
    --line: #2C3325;
    --accent: #7EA8D6;
    --accent-ink: #0F1610;
    --accent-soft: #223448;
    --good: #4FAE84;
    --good-soft: #16352A;
    --warn: #D89A4A;
    --warn-soft: #3A2A14;
    --danger: #E07872;
    --danger-soft: #3A1E1C;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 1px rgba(0, 0, 0, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Segoe UI Variable", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .num {
    font-family: "Cascadia Code", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  a { color: inherit; text-decoration: none; }

  [hidden] { display: none !important; }

  input[type="text"], input[type="password"], input[type="url"] {
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
    width: 100%;
  }

  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .form-error {
    color: var(--danger);
    font-size: 12px;
    margin: 0;
    min-height: 15px;
  }

  /* ---------- Login ---------- */
  .login-view {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
  }

  .login-card {
    width: 100%;
    max-width: 300px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .login-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
  }

  /* ---------- Shell ---------- */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 20px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
  }

  .brand .mark, .login-brand .mark {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    flex: none;
  }

  .brand .mark svg, .login-brand .mark svg { width: 13px; height: 13px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 7px;
    color: var(--ink-soft);
    font-weight: 500;
    cursor: default;
  }

  .nav-item svg {
    width: 16px;
    height: 16px;
    flex: none;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
  }

  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .nav-item:not(.active):hover { background: var(--surface); color: var(--ink); }

  .sidebar-footer {
    margin-top: auto;
    padding: 10px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  .logout-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

  .logout-btn:hover { color: var(--danger); }

  /* ---------- Main ---------- */
  .main { padding: 28px 32px 48px; max-width: 1280px; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
  }

  .topbar h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .topbar .sub { color: var(--ink-soft); font-size: 13px; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    padding: 9px 15px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }

  .btn-primary:disabled { opacity: 0.6; cursor: default; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 15px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-small { padding: 6px 12px; font-size: 12px; }

  .btn-primary svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-head h2 {
    font-size: 15px;
    margin: 0;
  }

  .section-head .count {
    color: var(--ink-faint);
    font-size: 12px;
  }

  .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    align-items: start;
    gap: 14px;
  }

  .empty {
    grid-column: 1 / -1;
    color: var(--ink-faint);
    font-size: 13px;
    padding: 10px 2px 22px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }

  .thumb {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 8px;
    background: var(--surface-2);
    display: grid;
    place-items: center;
    color: var(--ink-faint);
    overflow: hidden;
  }

  .thumb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.4; }

  .thumb img {
    display: block;
    width: 100%;
    height: 64px;
    max-height: 64px;
    object-fit: contain;
  }

  .card-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .card .name {
    display: block;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    font: inherit;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
    font-weight: 600;
    font-size: 13px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card .name:hover,
  .card .name:focus-visible {
    color: var(--accent);
    text-decoration: underline;
  }

  .store-chip {
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .price {
    font-size: 17px;
    font-weight: 700;
    margin-top: 2px;
  }

  .status {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .stock-pill {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  .stock-pill.in { color: var(--good); background: var(--good-soft); }
  .stock-pill.low { color: var(--warn); background: var(--warn-soft); }
  .stock-pill.out { color: var(--danger); background: var(--danger-soft); }
  .stock-pill.unknown { color: var(--ink-soft); background: var(--surface-2); }

  .checked {
    color: var(--ink-faint);
    font-size: 11px;
    white-space: nowrap;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 2px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .delete-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  .delete-btn:hover { color: var(--danger); }

  .delete-btn:disabled { opacity: 0.5; cursor: default; }

  .card.add {
    border-style: dashed;
    border-color: var(--ink-faint);
    background: transparent;
    box-shadow: none;
    color: var(--ink-soft);
  }

  .add-trigger {
    background: none;
    border: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
  }

  .card.add .plus {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
  }

  .card.add .plus svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }

  .card.add .add-text { display: flex; flex-direction: column; gap: 2px; }
  .card.add .label { font-weight: 600; font-size: 12.5px; }
  .card.add .hint { font-size: 11px; color: var(--ink-faint); }

  .add-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .add-form-row { display: flex; align-items: center; gap: 8px; }
  .add-form-row label { flex: none; width: 76px; }
  .add-form-row input { flex: 1; }

  .add-form-actions { display: flex; gap: 8px; }
  .add-form-actions .btn-primary, .add-form-actions .btn-secondary { flex: 1; }

  .add-form .form-error:empty { display: none; min-height: 0; margin: 0; }

  .card.add.editing .add-trigger { display: none; }
  .card.add.editing .add-form { display: flex; }

  @media (max-width: 480px) {
    .products { grid-template-columns: 1fr; }
  }

  /* ---------- Product detail ---------- */
  #detail-back {
    margin-bottom: 18px;
  }

  .detail-head {
    margin-bottom: 20px;
  }

  .detail-head h1 {
    margin: 0 0 10px;
    font-size: 20px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .detail-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .detail-price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .detail-price {
    font-size: 26px;
    font-weight: 700;
  }

  .detail-checked {
    color: var(--ink-faint);
    font-size: 12px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--shadow);
  }

  .chart-card h2 {
    margin: 0 0 14px;
    font-size: 15px;
  }

  .chart-container {
    position: relative;
  }

  .price-chart {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .chart-grid {
    stroke: var(--line);
    stroke-width: 1;
  }

  .chart-axis-label {
    font-size: 10.5px;
    fill: var(--ink-faint);
    font-family: inherit;
  }

  .chart-axis-y { text-anchor: end; }
  .chart-axis-x { text-anchor: middle; }

  .chart-area {
    fill: var(--accent);
    opacity: 0.1;
  }

  .chart-line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .chart-end-dot, .chart-hover-dot {
    fill: var(--accent);
    stroke: var(--surface);
    stroke-width: 2;
  }

  .chart-crosshair {
    stroke: var(--ink-faint);
    stroke-width: 1;
  }

  .chart-hit-rect {
    fill: transparent;
    cursor: crosshair;
  }

  .chart-tooltip {
    position: absolute;
    transform: translate(-50%, -125%);
    background: var(--ink);
    color: var(--paper);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: var(--shadow);
  }

  .chart-tooltip-value {
    font-weight: 700;
    font-size: 13px;
  }

  .chart-tooltip-date {
    opacity: 0.8;
    font-size: 11px;
  }
</style>

<div class="login-view" id="login-view">
  <form class="login-card" id="login-form">
    <div class="login-brand">
      <span class="mark">
        <svg viewBox="0 0 24 24"><path d="M3 12 L12 3 L21 12 L21 21 L3 21 Z" /></svg>
      </span>
      Price Tracker
    </div>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="btn-primary" type="submit">Log in</button>
    <p class="form-error" id="login-error"></p>
  </form>
</div>

<div class="app" id="app-view" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24"><path d="M3 12 L12 3 L21 12 L21 21 L3 21 Z" /></svg>
      </span>
      Price Tracker
    </div>

    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      Dashboard
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24"><path d="M4 4 L12 4 L20 12 L12 20 L4 12 Z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg>
      Products
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24"><path d="M3 9 L4 4 L20 4 L21 9"/><path d="M4 9 L20 9 L20 20 L4 20 Z"/><path d="M9 20 L9 14 L15 14 L15 20"/></svg>
      Stores
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7 L12 12 L16 14.5"/></svg>
      Past Sales
    </a>

    <div class="sidebar-footer">
      <button type="button" class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div id="dashboard-view">
      <div class="topbar">
        <div>
          <h1>Dashboard</h1>
          <div class="sub" id="topbar-sub">Loading&hellip;</div>
        </div>
      </div>

      <section>
        <div class="section-head">
          <h2>Tracked products</h2>
          <span class="count" id="product-count"></span>
        </div>

        <div class="products">
          <div id="product-list" style="display:contents"></div>

          <article class="card add" id="add-card">
            <button type="button" class="add-trigger" id="add-toggle">
              <span class="plus">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </span>
              <span class="add-text">
                <span class="label">Add product</span>
                <span class="hint">Track a new URL</span>
              </span>
            </button>

            <form class="add-form" id="add-form">
              <div class="add-form-row">
                <label for="product-url">Product URL</label>
                <input type="url" id="product-url" name="url" placeholder="https://&hellip;" required>
              </div>
              <div class="add-form-actions">
                <button type="submit" class="btn-primary btn-small">Add</button>
                <button type="button" class="btn-secondary btn-small" id="add-cancel">Cancel</button>
              </div>
              <p class="form-error" id="add-error"></p>
            </form>
          </article>
        </div>
      </section>
    </div>

    <section id="product-detail-view" hidden>
      <button type="button" class="btn-secondary btn-small" id="detail-back">&larr; Back to dashboard</button>

      <div class="detail-head">
        <h1 id="detail-name"></h1>
        <div class="detail-meta">
          <span class="store-chip" id="detail-store"></span>
          <span class="stock-pill" id="detail-stock"></span>
        </div>
        <div class="detail-price-row">
          <span class="detail-price num" id="detail-price"></span>
          <span class="detail-checked" id="detail-checked"></span>
        </div>
      </div>

      <div class="chart-card">
        <h2>Price history</h2>
        <div class="chart-container" id="chart-container"></div>
      </div>
    </section>
  </main>
</div>

<script>
  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");
  const loginForm = document.getElementById("login-form");
  const loginError = document.getElementById("login-error");
  const logoutBtn = document.getElementById("logout-btn");

  const topbarSub = document.getElementById("topbar-sub");
  const productCount = document.getElementById("product-count");
  const productList = document.getElementById("product-list");

  const addCard = document.getElementById("add-card");
  const addToggle = document.getElementById("add-toggle");
  const addCancel = document.getElementById("add-cancel");
  const addForm = document.getElementById("add-form");
  const addError = document.getElementById("add-error");

  const dashboardView = document.getElementById("dashboard-view");
  const productDetailView = document.getElementById("product-detail-view");
  const detailBack = document.getElementById("detail-back");
  const detailName = document.getElementById("detail-name");
  const detailStore = document.getElementById("detail-store");
  const detailStock = document.getElementById("detail-stock");
  const detailPrice = document.getElementById("detail-price");
  const detailChecked = document.getElementById("detail-checked");
  const chartContainer = document.getElementById("chart-container");

  const STOCK_LABELS = {
    in_stock: { text: "In stock", cls: "in" },
    low_stock: { text: "Low stock", cls: "low" },
    out_of_stock: { text: "Out of stock", cls: "out" },
  };

  function stockInfo(status) {
    return STOCK_LABELS[status] || { text: "Unknown", cls: "unknown" };
  }

  const THUMB_PLACEHOLDER = `<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/></svg>`;

  function truncateWords(text, maxWords) {
    const words = text.trim().split(/\s+/);
    if (words.length <= maxWords) return text;
    return words.slice(0, maxWords).join(" ") + "…";
  }

  function showApp() {
    loginView.hidden = true;
    appView.hidden = false;
  }

  function showLogin() {
    appView.hidden = true;
    loginView.hidden = false;
  }

  function renderProducts(products) {
    const today = new Date().toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    const storeCount = new Set(products.map((p) => p.store)).size;
    productCount.textContent = `${products.length} item${products.length === 1 ? "" : "s"}`;
    topbarSub.textContent = `${today} · ${products.length} product${products.length === 1 ? "" : "s"} tracked across ${storeCount} store${storeCount === 1 ? "" : "s"}`;

    productList.innerHTML = "";

    if (products.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No products tracked yet — add one to get started.";
      productList.appendChild(empty);
      return;
    }

    for (const product of products) {
      const stock = stockInfo(product.stock_status);
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="thumb">${THUMB_PLACEHOLDER}</div>
        <div class="card-info">
          <button type="button" class="name" data-id="${product.id}"></button>
          <span class="store-chip"></span>
          <span class="price num"></span>
        </div>
        <div class="status">
          <span class="stock-pill ${stock.cls}">${stock.text}</span>
          <span class="checked"></span>
          <button type="button" class="delete-btn" data-id="${product.id}" title="Remove product">
            <svg viewBox="0 0 24 24"><path d="M4 7 L20 7"/><path d="M9 7 L9 4 L15 4 L15 7"/><path d="M6 7 L7 20 L17 20 L18 7"/></svg>
          </button>
        </div>
      `;
      const fullName = product.name || "Untitled product";
      const nameEl = card.querySelector(".name");
      nameEl.textContent = truncateWords(fullName, 6);
      nameEl.title = fullName;

      if (product.image_url) {
        const thumb = card.querySelector(".thumb");
        const img = document.createElement("img");
        img.src = product.image_url;
        img.alt = fullName;
        img.loading = "lazy";
        img.onerror = () => { thumb.innerHTML = THUMB_PLACEHOLDER; };
        thumb.innerHTML = "";
        thumb.appendChild(img);
      }
      card.querySelector(".store-chip").textContent = product.store || "Unknown store";
      card.querySelector(".price").textContent =
        product.price != null ? `$${Number(product.price).toFixed(2)}` : "—";
      card.querySelector(".checked").textContent = product.checked_at
        ? `checked ${new Date(product.checked_at).toLocaleDateString()}`
        : "not yet checked";
      productList.appendChild(card);
    }
  }

  async function showProductDetail(id) {
    detailName.textContent = "Loading…";
    detailStore.textContent = "";
    detailStock.textContent = "";
    detailStock.className = "stock-pill";
    detailPrice.textContent = "";
    detailChecked.textContent = "";
    chartContainer.innerHTML = "";

    const res = await fetch(`/api/products/${id}/history`);
    if (!res.ok) {
      detailName.textContent = "Product not found";
      return;
    }

    const { product, history } = await res.json();
    const fullName = product.name || "Untitled product";
    const latest = history[history.length - 1];
    const stock = stockInfo(latest ? latest.stock_status : undefined);

    detailName.textContent = fullName;
    detailStore.textContent = product.store || "Unknown store";
    detailStock.textContent = stock.text;
    detailStock.className = `stock-pill ${stock.cls}`;
    detailPrice.textContent = latest ? `$${Number(latest.price).toFixed(2)}` : "—";
    detailChecked.textContent = latest
      ? `checked ${new Date(latest.checked_at).toLocaleDateString()}`
      : "not yet checked";

    drawPriceChart(chartContainer, history);
  }

  function niceScale(min, max) {
    if (min === max) {
      min -= 1;
      max += 1;
    }
    const roughStep = (max - min) / 4;
    const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
    const residual = roughStep / magnitude;
    const step = residual > 5 ? 10 * magnitude : residual > 2 ? 5 * magnitude : residual > 1 ? 2 * magnitude : magnitude;

    const niceMin = Math.floor(min / step) * step;
    const niceMax = Math.ceil(max / step) * step;
    const ticks = [];
    for (let t = niceMin; t <= niceMax + step / 2; t += step) {
      ticks.push(Math.round(t * 100) / 100);
    }
    return { min: niceMin, max: niceMax, ticks };
  }

  function pickXTicks(n) {
    if (n <= 1) return [0];
    const maxTicks = Math.min(5, n);
    const idxs = new Set();
    for (let i = 0; i < maxTicks; i++) {
      idxs.add(Math.round((i / (maxTicks - 1)) * (n - 1)));
    }
    return Array.from(idxs).sort((a, b) => a - b);
  }

  function drawPriceChart(container, history) {
    container.innerHTML = "";

    if (history.length === 0) {
      container.innerHTML = '<p class="empty">No price history yet — check back after the next scrape.</p>';
      return;
    }

    const points = history.map((h) => ({ date: new Date(h.checked_at), price: Number(h.price) }));

    const width = 720;
    const height = 280;
    const margin = { top: 16, right: 16, bottom: 30, left: 60 };
    const innerW = width - margin.left - margin.right;
    const innerH = height - margin.top - margin.bottom;

    const prices = points.map((p) => p.price);
    const { min: yMin, max: yMax, ticks } = niceScale(Math.min(...prices), Math.max(...prices));

    const xFor = (i) => (points.length === 1 ? margin.left + innerW / 2 : margin.left + (i / (points.length - 1)) * innerW);
    const yFor = (price) => margin.top + innerH - ((price - yMin) / (yMax - yMin || 1)) * innerH;

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("class", "price-chart");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Price history over time");

    for (const tick of ticks) {
      const y = yFor(tick);
      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", margin.left);
      line.setAttribute("x2", width - margin.right);
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      line.setAttribute("class", "chart-grid");
      svg.appendChild(line);

      const label = document.createElementNS(svgNS, "text");
      label.setAttribute("x", margin.left - 8);
      label.setAttribute("y", y + 3.5);
      label.setAttribute("class", "chart-axis-label chart-axis-y");
      label.textContent = `$${tick.toLocaleString()}`;
      svg.appendChild(label);
    }

    for (const i of pickXTicks(points.length)) {
      const label = document.createElementNS(svgNS, "text");
      label.setAttribute("x", xFor(i));
      label.setAttribute("y", height - margin.bottom + 18);
      label.setAttribute("class", "chart-axis-label chart-axis-x");
      label.textContent = points[i].date.toLocaleDateString(undefined, { day: "numeric", month: "short" });
      svg.appendChild(label);
    }

    if (points.length > 1) {
      const areaD = [`M ${xFor(0)} ${yFor(points[0].price)}`];
      points.forEach((p, i) => areaD.push(`L ${xFor(i)} ${yFor(p.price)}`));
      areaD.push(`L ${xFor(points.length - 1)} ${margin.top + innerH}`, `L ${xFor(0)} ${margin.top + innerH}`, "Z");
      const area = document.createElementNS(svgNS, "path");
      area.setAttribute("d", areaD.join(" "));
      area.setAttribute("class", "chart-area");
      svg.appendChild(area);

      const lineD = points.map((p, i) => `${i === 0 ? "M" : "L"} ${xFor(i)} ${yFor(p.price)}`).join(" ");
      const line = document.createElementNS(svgNS, "path");
      line.setAttribute("d", lineD);
      line.setAttribute("class", "chart-line");
      svg.appendChild(line);
    }

    const lastI = points.length - 1;
    const endDot = document.createElementNS(svgNS, "circle");
    endDot.setAttribute("cx", xFor(lastI));
    endDot.setAttribute("cy", yFor(points[lastI].price));
    endDot.setAttribute("r", 5);
    endDot.setAttribute("class", "chart-end-dot");
    svg.appendChild(endDot);

    const crosshair = document.createElementNS(svgNS, "line");
    crosshair.setAttribute("y1", margin.top);
    crosshair.setAttribute("y2", margin.top + innerH);
    crosshair.setAttribute("class", "chart-crosshair");
    crosshair.style.display = "none";
    svg.appendChild(crosshair);

    const hoverDot = document.createElementNS(svgNS, "circle");
    hoverDot.setAttribute("r", 5);
    hoverDot.setAttribute("class", "chart-hover-dot");
    hoverDot.style.display = "none";
    svg.appendChild(hoverDot);

    const hitRect = document.createElementNS(svgNS, "rect");
    hitRect.setAttribute("x", margin.left);
    hitRect.setAttribute("y", margin.top);
    hitRect.setAttribute("width", innerW);
    hitRect.setAttribute("height", innerH);
    hitRect.setAttribute("class", "chart-hit-rect");
    svg.appendChild(hitRect);

    container.appendChild(svg);

    const tooltip = document.createElement("div");
    tooltip.className = "chart-tooltip";
    tooltip.hidden = true;
    container.appendChild(tooltip);

    function updateHover(clientX) {
      const rect = svg.getBoundingClientRect();
      const localX = (clientX - rect.left) * (width / rect.width);
      let nearest = 0;
      let nearestDist = Infinity;
      points.forEach((p, i) => {
        const d = Math.abs(xFor(i) - localX);
        if (d < nearestDist) {
          nearestDist = d;
          nearest = i;
        }
      });

      const px = xFor(nearest);
      const py = yFor(points[nearest].price);
      crosshair.setAttribute("x1", px);
      crosshair.setAttribute("x2", px);
      crosshair.style.display = "block";
      hoverDot.setAttribute("cx", px);
      hoverDot.setAttribute("cy", py);
      hoverDot.style.display = "block";

      tooltip.innerHTML = "";
      const valueEl = document.createElement("div");
      valueEl.className = "chart-tooltip-value";
      valueEl.textContent = `$${points[nearest].price.toFixed(2)}`;
      const dateEl = document.createElement("div");
      dateEl.className = "chart-tooltip-date";
      dateEl.textContent = points[nearest].date.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
      tooltip.appendChild(valueEl);
      tooltip.appendChild(dateEl);
      tooltip.hidden = false;
      tooltip.style.left = `${(px / width) * 100}%`;
      tooltip.style.top = `${(py / height) * 100}%`;
    }

    hitRect.addEventListener("pointermove", (e) => updateHover(e.clientX));
    hitRect.addEventListener("pointerleave", () => {
      crosshair.style.display = "none";
      hoverDot.style.display = "none";
      tooltip.hidden = true;
    });
  }

  async function loadProducts() {
    const res = await fetch("/api/products");
    if (res.status === 401) {
      showLogin();
      return;
    }
    const products = await res.json();
    showApp();
    route(products);
  }

  function route(products) {
    const match = location.hash.match(/^#\/product\/(\d+)/);
    if (match) {
      dashboardView.hidden = true;
      productDetailView.hidden = false;
      showProductDetail(Number(match[1]));
    } else {
      productDetailView.hidden = true;
      dashboardView.hidden = false;
      renderProducts(products);
    }
  }

  window.addEventListener("hashchange", () => {
    if (!appView.hidden) loadProducts();
  });

  detailBack.addEventListener("click", () => {
    location.hash = "";
  });

  productList.addEventListener("click", async (event) => {
    const nameBtn = event.target.closest(".name");
    if (nameBtn) {
      location.hash = `#/product/${nameBtn.dataset.id}`;
      return;
    }

    const btn = event.target.closest(".delete-btn");
    if (!btn) return;

    const id = btn.dataset.id;
    if (!confirm("Remove this product from tracking?")) return;

    btn.disabled = true;
    try {
      const res = await fetch(`/api/products/${id}`, { method: "DELETE" });
      if (res.ok) {
        loadProducts();
      } else {
        btn.disabled = false;
      }
    } catch {
      btn.disabled = false;
    }
  });

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    loginError.textContent = "";
    const formData = new FormData(loginForm);
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: formData.get("username"),
        password: formData.get("password"),
      }),
    });
    if (res.ok) {
      loginForm.reset();
      loadProducts();
    } else {
      const data = await res.json().catch(() => ({}));
      loginError.textContent = data.error || "Login failed.";
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    showLogin();
  });

  addToggle.addEventListener("click", () => {
    addCard.classList.add("editing");
  });

  addCancel.addEventListener("click", () => {
    addForm.reset();
    addError.textContent = "";
    addCard.classList.remove("editing");
  });

  addForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    addError.textContent = "";
    const formData = new FormData(addForm);
    const submitBtn = addForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "Adding…";
    try {
      const res = await fetch("/api/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: formData.get("url") }),
      });
      const data = await res.json();
      if (!res.ok) {
        addError.textContent = data.error || "Could not add product.";
        return;
      }
      addForm.reset();
      addCard.classList.remove("editing");
      loadProducts();
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Add";
    }
  });

  loadProducts();
</script>
